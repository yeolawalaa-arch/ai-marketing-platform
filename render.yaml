services:
  - type: web
    name: ai-marketing-hub
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 120 --preload --worker-class gthread
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
